[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-subagent-orchestrator"
version = "0.1.0"
description = "Select models and reasoning effort when running parallel Codex subagents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Codex Subagent Orchestrator contributors" }]

[project.scripts]
codex-subagent = "orchestrator:main"
